name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Agent skill matches README
        run: npm run skill:build -- --check

      - name: Audit
        run: npm audit --audit-level=high --omit=dev

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test workspaces
        run: npm test --workspaces --if-present

      - name: Build workspaces
        run: npm run build --workspaces --if-present

  integration:
    name: Integration (GreenMail, Node 22)
    runs-on: ubuntu-latest
    env:
      GREENMAIL_CACHE: ~/.cache/greenmail
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache GreenMail
        uses: actions/cache@v4
        with:
          path: ~/.cache/greenmail
          key: greenmail-2.1.14

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  # Publishability check per package. Skipped for PRs from forks (no secrets there).
  dry-run:
    name: Dry-run publish
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        workspace: ['.', packages/trap, packages/cli, packages/testing]
    uses: ./.github/workflows/dryrun.yml
    with:
      workspace: ${{ matrix.workspace }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
