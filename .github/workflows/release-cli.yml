name: Release @mailts/cli

on:
  push:
    tags:
      - '@mailts/cli@*'

jobs:
  release:
    name: Build, Sign & Publish @mailts/cli
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=packages/cli

      - name: Build
        run: npm run build --workspace=packages/cli

      - name: Verify tag matches package version
        working-directory: packages/cli
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#@mailts/cli@}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Rewrite file deps to published semver
        working-directory: packages/cli
        run: |
          MV=$(node -p 'require("../../package.json").version')
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));if(p.devDependencies&&p.devDependencies.mailts&&p.devDependencies.mailts.startsWith('file:'))p.devDependencies.mailts='>=${MV} <2.0.0';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (signed)
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
