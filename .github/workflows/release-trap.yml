name: Release @mailts/trap

# Manual only — you choose the order (core → trap → cli / testing).
# Run with dry_run (default) to verify and preview notes; run again with it off to publish.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only — verify, dry-run publish and preview notes; no tag, release or publish'
        type: boolean
        default: true

concurrency:
  group: release-trap
  cancel-in-progress: false

jobs:
  release:
    name: Build, Sign & Publish @mailts/trap
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Publishing runs only from master
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/master' }}
        run: |
          echo "::error::Publish from master (this run is on ${GITHUB_REF_NAME}). Dry runs work on any branch."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=packages/trap

      - name: Test
        run: npm test --workspace=packages/trap

      - name: Build
        run: npm run build --workspace=packages/trap

      - name: Rewrite file deps to published semver
        working-directory: packages/trap
        run: |
          MV=$(node -p 'require("../../package.json").version')
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));if(p.devDependencies&&p.devDependencies['@mailts/core']&&p.devDependencies['@mailts/core'].startsWith('file:'))p.devDependencies['@mailts/core']='>=${MV} <2.0.0';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      # Version not yet on npm, tag free, and every @mailts/* it needs already published
      - name: Release preflight
        id: release_tag
        uses: ./.github/actions/release-preflight
        with:
          working-directory: packages/trap

      # Prove the publish would succeed BEFORE a GitHub Release is created
      - name: Verify publish (dry run)
        uses: ./.github/actions/npm-dry-run
        with:
          working-directory: packages/trap
          npm-token: ${{ secrets.NPM_TOKEN }}

      # AI release notes via ledger (Bedrock); falls back to GitHub's auto notes
      - name: Generate release notes (ledger)
        id: notes
        uses: ./.github/actions/release-notes
        with:
          package: '@mailts/trap'
          tag: ${{ steps.release_tag.outputs.tag }}
          bedrock-api-key: ${{ secrets.BEDROCK_API_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          model: ${{ vars.LEDGER_MODEL }}

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.generated == 'true' && steps.notes.outputs.notes-file || '' }}
          generate_release_notes: ${{ steps.notes.outputs.generated != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (signed)
        if: ${{ !inputs.dry_run }}
        working-directory: packages/trap
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
