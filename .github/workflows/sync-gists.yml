name: Sync example gists

on:
  push:
    branches: [master]
    paths: ['examples/**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Upsert gists
        run: node scripts/sync-gists.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
